<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>춘양초 저녁 메뉴 알림장</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">춘양초 급식 알림장</p>
          <h1 id="app-title">점심 보고 저녁 숙제 끝!</h1>
        </div>
        <div class="quota-pill" aria-live="polite">
          <span>오늘의 추천 도장</span>
          <strong id="quotaCount">2회</strong>
        </div>
      </section>

      <section class="control-strip" aria-label="급식 날짜 고르기">
        <label class="date-field">
          <span>급식 날짜</span>
          <input id="mealDate" type="date" />
        </label>
        <button id="todayButton" class="icon-button secondary" type="button">
          <i data-lucide="calendar-days" aria-hidden="true"></i>
          <span>오늘</span>
        </button>
        <button id="loadButton" class="icon-button primary" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>점심 불러오기</span>
        </button>
      </section>

      <section class="content-grid">
        <article class="tool-panel lunch-panel" aria-labelledby="lunch-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">1교시 Lunch</p>
              <h2 id="lunch-title">오늘 점심 칠판</h2>
            </div>
            <span id="sourceBadge" class="source-badge">급식표</span>
          </div>

          <div id="mealStatus" class="status-line" role="status">급식표 붙이는 중</div>
          <ul id="mealList" class="meal-list" aria-label="점심 메뉴"></ul>

          <div class="nutrition-row">
            <div>
              <span class="metric-label">열량</span>
              <strong id="calories">-</strong>
            </div>
            <div>
              <span class="metric-label">단백질</span>
              <strong id="protein">-</strong>
            </div>
            <div>
              <span class="metric-label">지방</span>
              <strong id="fat">-</strong>
            </div>
          </div>
        </article>

        <article class="tool-panel analysis-panel" aria-labelledby="analysis-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">2교시 Balance</p>
              <h2 id="analysis-title">영양 균형 점검</h2>
            </div>
          </div>

          <div class="score-wrap" aria-label="균형 점수">
            <div class="score-ring">
              <span id="balanceScore">-</span>
            </div>
            <div>
              <strong id="balanceTitle">급식표 기다리는 중</strong>
              <p id="balanceCopy">점심 메뉴가 들어오면 저녁 숙제 방향을 잡아줘요.</p>
            </div>
          </div>

          <div id="analysisTags" class="tag-row" aria-label="점심 특징"></div>
        </article>
      </section>

      <section class="recommend-section" aria-labelledby="recommend-title">
        <div class="recommend-head">
          <div>
            <p class="section-label">3교시 Dinner</p>
            <h2 id="recommend-title">저녁 메뉴 숙제</h2>
          </div>

          <div class="preference-group" aria-label="추천 취향">
            <button class="pref-button active" type="button" data-pref="balanced">골고루</button>
            <button class="pref-button" type="button" data-pref="light">가볍게</button>
            <button class="pref-button" type="button" data-pref="hearty">든든히</button>
            <button class="pref-button" type="button" data-pref="veggie">채소 많이</button>
          </div>
        </div>

        <button id="recommendButton" class="icon-button recommend-button" type="button">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span>저녁 숙제 받기</span>
        </button>

        <div id="lockMessage" class="lock-message" hidden>
          오늘 추천 도장을 모두 찍었어요.
        </div>

        <div id="recommendations" class="recommendation-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
