<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>춘양초 저녁메뉴 추천</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-labelledby="app-title">
        <div class="title-block">
          <p class="eyebrow">봉화 춘양초등학교</p>
          <h1 id="app-title">오늘 저녁, 자연스럽게</h1>
          <p class="lead">점심 메뉴의 흐름을 보고 취향에 맞는 저녁을 골라요.</p>
        </div>
        <div class="quota-pill" aria-live="polite">
          <span>오늘 남은 추천</span>
          <strong id="quotaCount">2회</strong>
        </div>
      </header>

      <section class="control-strip" aria-label="급식 조회">
        <label class="date-field">
          <span>날짜</span>
          <input id="mealDate" type="date" />
        </label>
        <button id="todayButton" class="icon-button secondary" type="button">
          <i data-lucide="calendar-days" aria-hidden="true"></i>
          <span>오늘</span>
        </button>
        <button id="loadButton" class="icon-button primary" type="button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>점심 불러오기</span>
        </button>
      </section>

      <section class="content-grid">
        <article class="tool-panel lunch-panel" aria-labelledby="lunch-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">Lunch</p>
              <h2 id="lunch-title">오늘 점심</h2>
            </div>
            <span id="sourceBadge" class="source-badge">NEIS</span>
          </div>

          <div id="mealStatus" class="status-line" role="status">급식을 불러오는 중</div>
          <ul id="mealList" class="meal-list" aria-label="점심 메뉴"></ul>

          <div class="nutrition-row">
            <div>
              <span class="metric-label">열량</span>
              <strong id="calories">-</strong>
            </div>
            <div>
              <span class="metric-label">단백질</span>
              <strong id="protein">-</strong>
            </div>
            <div>
              <span class="metric-label">지방</span>
              <strong id="fat">-</strong>
            </div>
          </div>
        </article>

        <article class="tool-panel note-panel" aria-labelledby="analysis-title">
          <div class="panel-heading">
            <div>
              <p class="section-label">Lunch Note</p>
              <h2 id="analysis-title">점심 메모</h2>
            </div>
          </div>

          <div class="note-copy" aria-live="polite">
            <strong id="balanceTitle">메뉴를 기다리는 중</strong>
            <p id="balanceCopy">점심 메뉴가 들어오면 저녁 추천을 준비할게요.</p>
          </div>

          <div id="analysisTags" class="tag-row" aria-label="점심 키워드"></div>
        </article>
      </section>

      <section class="recommend-section" aria-labelledby="recommend-title">
        <div class="recommend-head">
          <div>
            <p class="section-label">Dinner</p>
            <h2 id="recommend-title">저녁 메뉴 추천</h2>
          </div>

          <div class="preference-group" aria-label="추천 취향">
            <button class="pref-button active" type="button" data-pref="balanced">고르게</button>
            <button class="pref-button" type="button" data-pref="light">산뜻하게</button>
            <button class="pref-button" type="button" data-pref="hearty">든든하게</button>
            <button class="pref-button" type="button" data-pref="veggie">채소 중심</button>
          </div>
        </div>

        <button id="recommendButton" class="icon-button recommend-button" type="button">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span>저녁 추천 받기</span>
        </button>

        <div id="lockMessage" class="lock-message" hidden>
          오늘 추천은 여기까지예요.
        </div>

        <div id="recommendations" class="recommendation-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
